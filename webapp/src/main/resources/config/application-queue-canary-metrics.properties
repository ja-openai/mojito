# Optional Spring profile: queue-canary-metrics. Apply to BOTH Quartz baseline and
# queue canary pods before measuring p95. This enables no queue routes or endpoints.
# Approve bounds/series budget for the cohort; values above these maxima overflow
# the last finite histogram bucket, so a p95 there cannot certify the latency gate.

management.metrics.distribution.percentiles-histogram.assetWS.getLocalizedAssetForContentAsync.schedule.latency=true
management.metrics.distribution.minimum-expected-value.assetWS.getLocalizedAssetForContentAsync.schedule.latency=1ms
management.metrics.distribution.maximum-expected-value.assetWS.getLocalizedAssetForContentAsync.schedule.latency=60s

management.metrics.distribution.percentiles-histogram.asyncJobQueue.claim.latency=true
management.metrics.distribution.minimum-expected-value.asyncJobQueue.claim.latency=1ms
management.metrics.distribution.maximum-expected-value.asyncJobQueue.claim.latency=10s

management.metrics.distribution.percentiles-histogram.asyncJobQueue.queueWait.latency=true
management.metrics.distribution.minimum-expected-value.asyncJobQueue.queueWait.latency=1ms
management.metrics.distribution.maximum-expected-value.asyncJobQueue.queueWait.latency=5m

management.metrics.distribution.percentiles-histogram.asyncJobQueue.processing.latency=true
management.metrics.distribution.minimum-expected-value.asyncJobQueue.processing.latency=1ms
management.metrics.distribution.maximum-expected-value.asyncJobQueue.processing.latency=5m

management.metrics.distribution.percentiles-histogram.quartz.jobs.execution=true
management.metrics.distribution.minimum-expected-value.quartz.jobs.execution=1ms
management.metrics.distribution.maximum-expected-value.quartz.jobs.execution=5m

management.metrics.distribution.percentiles-histogram.quartz.jobs.waiting=true
management.metrics.distribution.minimum-expected-value.quartz.jobs.waiting=1ms
management.metrics.distribution.maximum-expected-value.quartz.jobs.waiting=5m

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: mojito
      POSTGRES_USER: mojito
      POSTGRES_PASSWORD: ChangeMe
  opensearch:
    build:
      context: ./opensearch
    image: mojito-opensearch:2.17.1
    restart: always
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - opensearch-data:/usr/share/opensearch/data
  webapp:
    depends_on:
      - db
      - opensearch
    build:
      dockerfile: docker/Dockerfile-bk8
#      dockerfile: docker/Dockerfile-bk11
#      dockerfile: docker/Dockerfile-bk16
      context: ../
#    image: aurambaj/mojito-webapp-bk8:latest
    links:
      - db
    ports:
      - "8080:8080"
    restart: always
    environment:
#      JAVA_OPTS: '-Xms2g'
      SPRING_APPLICATION_JSON: '{
      "spring.profiles.active": "postgres",
      "spring.datasource.url" : "jdbc:postgresql://db:5432/mojito",
      "spring.datasource.username" : "mojito",
      "spring.datasource.password" : "ChangeMe",
      "spring.datasource.driverClassName" : "org.postgresql.Driver",
      "l10n.search-index.enabled" : "true",
      "l10n.search-index.base-url" : "http://opensearch:9200"
      }'

volumes:
  opensearch-data:

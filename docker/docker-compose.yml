version: '2'
services:
  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ChangeMe
      MYSQL_DATABASE: mojito
      MYSQL_USER: mojito
      MYSQL_PASSWORD: ChangeMe
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  opensearch:
    build:
      context: ./opensearch
    image: mojito-opensearch:2.17.1
    restart: always
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - opensearch-data:/usr/share/opensearch/data
  webapp:
    depends_on:
      - db
      - redis
      - opensearch
    build:
      dockerfile: docker/Dockerfile-bk8
#      dockerfile: docker/Dockerfile-bk11
#      dockerfile: docker/Dockerfile-bk16
      context: ../
#    image: aurambaj/mojito-webapp-bk8:latest
    links:
      - db
    ports:
      - "8080:8080"
    restart: always
    environment:
#      JAVA_OPTS: '-Xms2g'
      SPRING_APPLICATION_JSON: '{
      "spring.flyway.enabled": "true",
      "l10n.flyway.clean" : "false",
      "spring.jpa.database-platform" : "org.hibernate.dialect.MySQLDialect",
      "spring.jpa.hibernate.ddl-auto" : "none",
      "spring.datasource.url" : "jdbc:mysql://db:3306/mojito?characterEncoding=UTF-8&useUnicode=true",
      "spring.datasource.username" : "mojito",
      "spring.datasource.password" : "ChangeMe",
      "spring.datasource.driverClassName" : "com.mysql.cj.jdbc.Driver",
      "l10n.redis.enabled" : "true",
      "l10n.redis.host" : "redis",
      "l10n.search-index.enabled" : "true",
      "l10n.search-index.base-url" : "http://opensearch:9200"
      }'

volumes:
  opensearch-data:

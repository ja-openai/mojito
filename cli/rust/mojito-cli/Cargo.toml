[package]
name = "mojito-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native Mojito push, pull, and localized-asset import client."
readme = "README.md"

[[bin]]
name = "mojito"
path = "src/main.rs"

[dependencies]
mojito-file-formats = { path = "../../../file-formats/rust/mojito-file-formats" }
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
url = "2.5"
uuid = { version = "1.22", features = ["v4"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.25"

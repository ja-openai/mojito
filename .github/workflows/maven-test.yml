name: Run tests - Ubuntu + Java 21

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Spotless check
        run: mvn spotless:check
      - name: Maven install, test skipped
        run: mvn install -DskipTests
      - name: Maven test
        run: mvn test

  async-job-queue-real-db-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Install webapp reactor dependencies
        run: mvn -pl webapp -am -Pno-local-config install -DskipTests
      - name: Run async job queue MySQL/PostgreSQL contract
        run: >-
          mvn -pl webapp -Pno-local-config
          -Dtest=JdbcAsyncJobStoreDatabaseIntegrationTest,JdbcAsyncJobStorePoolIntegrationTest,JdbcAsyncJobStoreTimezoneIntegrationTest,AsyncJobQueueJpaTransactionIntegrationTest,JdbcPostgresAsyncJobQueueWakeupListenerDatabaseIntegrationTest,AsyncJobQueueProcessCrashIntegrationTest,AssetLocalizeAsyncJobOutputRetryIntegrationTest
          -Dmojito.asyncJobQueue.testcontainers=true
          -Dsurefire.rerunFailingTestsCount=0 test
      - name: Build queue packaging probe without Mojito parent or AspectJ
        run: mvn -f dev-docs/queue-library-probe/engine/pom.xml clean install
      - name: Verify separate consumer of the ordinary queue JAR
        run: mvn -f dev-docs/queue-library-probe/consumer/pom.xml spotless:check clean test -Dmojito.asyncJobQueue.testcontainers=true
      - name: Verify host-owned JPA transactions without Mojito or AspectJ
        run: mvn -f dev-docs/queue-library-probe/consumer/pom.xml -Pjpa spotless:check clean test

[package]
name = "mojito-file-formats"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Portable, fixture-conformant Mojito localization file converters."
readme = "README.md"

[dependencies]
mojito-mf2 = { version = "0.1.0", path = "../../../mf2/rust/mojito-mf2" }
quick-xml = "0.41"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yaml-rust2 = { version = "0.10.4", default-features = false }

<footer class="site-footer">

  <div class="wrapper">

    <h2 class="footer-heading">{{ site.title }}</h2>

    <div class="footer-col-wrapper">
      <div class="footer-col footer-col-1">
        <ul class="contact-list">
          <li>Questions? <a href="https://github.com/ja-openai/mojito/issues">Open a GitHub issue</a>.</li>
        </ul>
      </div>
              
      

      <div class="footer-col footer-col-2">
        <ul class="social-media-list">
          <li><a href="https://github.com/ja-openai/mojito"><span class="icon icon--github">{% include icon-github.svg %}</span><span class="username">GitHub</span></a></li>
          <li><a href="https://github.com/ja-openai/mojito/issues"><span class="icon icon--github">{% include icon-github.svg %}</span><span class="username">GitHub Issues</span></a></li>
          {% if site.twitter_username %}
          <li>
            {% include icon-twitter.html username=site.twitter_username %}
          </li>
          {% endif %}
        </ul>
      </div>

      <div class="footer-col footer-col-3">
        <p>{{ site.description }}</p>
      </div>
    </div>

  </div>

</footer>
